<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OP本">
<title>OP本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<!-- 加载中 -->
<section id="s-boot" class="center-screen">
  <img src="icons/icon-192.png" alt="" width="72" height="72" class="boot-ic">
  <div class="brand pulse">OP本</div>
  <div class="loader"><i></i></div>
</section>

<!-- 登录（和店铺日账同一个账号） -->
<section id="s-login" class="screen" hidden>
  <div class="intro">
    <img src="icons/icon-192.png" alt="" width="72" height="72" class="boot-ic">
    <div class="brand">OP本</div>
    <div class="en">SUPPLIER PAYMENTS</div>
    <p class="muted">进货发票 · 哪些 OP 已打、哪些没打</p>
  </div>
  <div class="card form">
    <button class="btn block google" id="btn-google"><span class="g">G</span> 用 Google 账号登录</button>
    <div class="or"><span>或用邮箱</span></div>
    <input id="in-email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="in-pw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <button class="btn primary block" id="btn-login">登录</button>
    <div class="links"><a id="lnk-register">没有账号？注册</a><a id="lnk-forgot">忘记密码</a></div>
  </div>
  <p class="hint">用和「店铺日账」一样的账号登录。<br>平时用 Google 登录的，也可以填 Gmail 地址，第一次点「忘记密码」设个密码，就能用邮箱登录（同一个账号，数据不变）。</p>
</section>

<!-- 提示页：没加入店铺 / 没权限 / 出错 -->
<section id="s-msg" class="center-screen" hidden>
  <img src="icons/icon-192.png" alt="" width="64" height="64" class="boot-ic">
  <h2 id="msg-title"></h2>
  <p id="msg-text" class="muted"></p>
  <div id="msg-btns" class="msg-btns"></div>
</section>

<!-- 主界面 -->
<div id="s-app" class="shell" hidden>
  <nav class="tabbar" id="tabbar">
    <div class="side-brand"><img src="icons/icon-48.png" alt="" width="28" height="28">OP本</div>
    <a href="#/" data-tab="home"><i data-ic="tabUnpaid"></i><span>未付</span></a>
    <a href="#/sup" data-tab="sup"><i data-ic="tabSup"></i><span>供应商</span></a>
    <a href="#/new" class="tab-add" data-tab="new"><i data-ic="add"></i><span>记发票</span></a>
    <a href="#/paid" data-tab="paid"><i data-ic="tabPaid"></i><span>已付</span></a>
    <a href="#/me" data-tab="me"><i data-ic="gear"></i><span>设置</span></a>
  </nav>
  <main id="view" class="view"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
